version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sewasetu}
      POSTGRES_USER: ${DB_USER:-sewasetu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sewasetu123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/02-init-db.sh:ro
      - ../seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sewasetu} -d ${DB_NAME:-sewasetu}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sewasetu}
      DB_USER: ${DB_USER:-sewasetu}
      DB_PASSWORD: ${DB_PASSWORD:-sewasetu123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sewasetu@123}
      ASSESSOR_USERNAME: ${ASSESSOR_USERNAME:-assessor_admin}
      ASSESSOR_PASSWORD: ${ASSESSOR_PASSWORD:-Purvanchal@Assess2027}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:-Purvanchal@Assess2027}
      SMS_GATEWAY_URL: http://smsgw:8025
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-ssp-prod-secret-key-2027}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_healthy
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  smsgw:
    build:
      context: ../smsgw
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8025"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8025/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../app
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "worker", "--interval", "3600"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sewasetu}
      DB_USER: ${DB_USER:-sewasetu}
      DB_PASSWORD: ${DB_PASSWORD:-sewasetu123}
      SMS_GATEWAY_URL: http://smsgw:8025
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - applogs:/var/log/sewasetu

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$TUNNEL_TOKEN" ]; then
          echo "Starting Cloudflare Named Tunnel with configured token..."
          exec cloudflared tunnel --no-autoupdate run --token "$$TUNNEL_TOKEN"
        else
          echo "Starting Cloudflare Quick Tunnel (auto-generated public HTTPS URL)..."
          exec cloudflared tunnel --no-autoupdate --url http://caddy:80
        fi
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy


volumes:
  pgdata:
  uploads:
  applogs:
  caddy_data:
  caddy_config:
